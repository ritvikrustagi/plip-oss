name: release dmg

# Push a tag like v0.9.0: this builds Plip-<version>.dmg with scripts/build_dmg.py and attaches it to a
# GitHub release, signed + notarized with the Apple secrets (docs/RELEASING.md) so it opens with no warning.
# A tag stops without them, or when it isn't pyproject's version. Run it by hand for an ad hoc test build:
# the DMG is kept on the run's page. With the Supabase secrets set it asks people to sign in.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v7
      - name: A tag ships signed, under its own version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; fi
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "::error::APPLE_CERT_P12 isn't set: this would publish an unsigned DMG that macOS blocks"; exit 1; fi
      - name: uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Developer ID certificate + notary login (only when the Apple secrets are set)
        if: env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
        run: |
          # A pasted secret can carry a stray space or newline, and Apple answers that with a 401.
          APPLE_ID=$(printf '%s' "$APPLE_ID" | tr -d '[:space:]')
          APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          APPLE_APP_PASSWORD=$(printf '%s' "$APPLE_APP_PASSWORD" | tr -d '[:space:]')
          APPLE_SIGN_ID=$(printf '%s' "$APPLE_SIGN_ID" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          # Say what's off without printing a secret: empty (an environment secret, not a repository one?) or the wrong shape.
          check() { if [ -z "$2" ]; then echo "::error::$1 is empty: add it under Settings > Secrets and variables > Actions > Repository secrets"; return 1;
                    elif printf '%s' "$2" | grep -Eq "$3"; then echo "$1: set, looks right"; else echo "::warning::$1 is set but doesn't look like $4"; fi; }
          check APPLE_ID "$APPLE_ID" '^[^@]+@[^@]+\.[^@]+$' "an email address"
          check APPLE_TEAM_ID "$APPLE_TEAM_ID" '^[A-Z0-9]{10}$' "a 10-character team ID"
          check APPLE_APP_PASSWORD "$APPLE_APP_PASSWORD" '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$' "an app-specific password (abcd-efgh-ijkl-mnop)"
          check APPLE_SIGN_ID "$APPLE_SIGN_ID" '^Developer ID Application: .+ \([A-Z0-9]{10}\)$' "Developer ID Application: Name (TEAMID)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials plip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "SIGN_ID=$APPLE_SIGN_ID" >> "$GITHUB_ENV"
      - name: Build Plip.app + the dmg
        env:
          PLIP_SUPABASE_URL: ${{ secrets.PLIP_SUPABASE_URL }}
          PLIP_SUPABASE_KEY: ${{ secrets.PLIP_SUPABASE_KEY }}
        run: |
          if [ -n "${SIGN_ID:-}" ]; then
            uv run --no-project --python 3.12 scripts/build_dmg.py --sign "$SIGN_ID" --notarize plip
          else
            uv run --no-project --python 3.12 scripts/build_dmg.py
          fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Plip-*.dmg
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: plip-dmg
          path: dist/Plip-*.dmg
          if-no-files-found: error

  # Windows has no signed installer yet (docs/WINDOWS.md), so a release carries a zip:
  # the wheel, the PowerShell installer and a short readme. Same release as the DMG, so
  # the Download section can point Mac and Windows people at one page.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: It installs and runs on a clean Windows box
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/check"
          $venv = "$env:RUNNER_TEMP/check/Scripts"
          & "$venv/pip" install (Get-ChildItem dist/*.whl).FullName
          & "$venv/plip" --help
          & "$venv/plip" capabilities
          & "$venv/plip" windows --once --no-probe
      - name: Zip it up
        shell: pwsh
        run: |
          # An array, not a here-string: PowerShell wants the closing "@ at column 0,
          # which a YAML block scalar can't give it.
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"' |
                      Select-Object -First 1).Matches[0].Groups[1].Value
          $stage = Join-Path $env:RUNNER_TEMP "Plip-$version-windows"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item dist/*.whl $stage
          Copy-Item scripts/install.ps1 $stage
          Copy-Item docs/WINDOWS.md $stage
          $readme = @(
            "Plip for Windows $version - an early build. Not signed, no installer yet.",
            "",
            "1. Install Python 3.12 from python.org.",
            "   Keep the tcl/tk option ticked: the window needs it.",
            "2. Open PowerShell in this folder and run:",
            "       py -3.12 -m venv .venv",
            "       .venv\Scripts\activate",
            "       pip install .\mcp_vision_runtime-$version-py3-none-any.whl",
            "3. plip capabilities    what this machine can and cannot do, and why",
            "   plip doctor          checks the brain, the voice and the window",
            "   plip                 the strip appears at the top of your screen",
            "",
            "Hold Ctrl+Alt and talk, or type in the box. Speech recognition needs an",
            "AssemblyAI key on Windows; typing works with no setup at all.",
            "",
            "Screenshots and the window map stay off until you switch them on under",
            "Session... Nothing is recorded until you start a learning session.",
            "",
            "WINDOWS.md lists what is and isn't ported, and what still needs testing."
          )
          Set-Content -Path (Join-Path $stage "README.txt") -Value $readme -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Plip-$version-windows.zip"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Plip-*-windows.zip
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: plip-windows
          path: dist/Plip-*-windows.zip
          if-no-files-found: error
